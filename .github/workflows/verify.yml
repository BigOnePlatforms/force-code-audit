# Self-test. The rulepack is the product here, so the thing CI has to prove is
# that the rules still fire — not merely that the YAML parses. Both bugs found
# while writing this pack survived `semgrep --validate`: a case-sensitive
# exclusion that flagged `secretName`, and ERROR-severity hits on
# interoperability-mandated SHA-1.
name: Verify rulepack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet semgrep==1.97.0
      - run: ./verify-rulepack.sh

  # Proves the action runs end to end, including that summarize.mjs degrades to
  # a warning rather than failing the job when FORCE is unreachable — which is
  # the behaviour every customer pipeline depends on.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          force-url: https://example.invalid
          connection-id: gh-smoke-test
          audit-secret: not-a-real-secret
          scope: full
